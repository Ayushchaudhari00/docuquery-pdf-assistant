spring.application.name=pdf-qa-assistant

# Database (Docker pgvector, port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/pqa_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=3600000

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2

# Uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.storage.dir=uploads

logging.level.PDFQuestion_AnsweringAssistant=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.vectorstore.pgvector.initialize-schema=true